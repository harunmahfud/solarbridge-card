<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; background: var(--page-background); }
      solarbridge-card { width: 100%; max-width: 760px; }
      solarbridge-card-editor { position: fixed; left: -10000px; }
      #result { display: none; }
    </style>
  </head>
  <body>
    <solarbridge-card></solarbridge-card>
    <solarbridge-card-editor></solarbridge-card-editor>
    <pre id="result">pending</pre>
    <script type="module">
      class FakeEntityPicker extends HTMLElement {
        connectedCallback() { this.tabIndex = 0; }
      }
      customElements.define("ha-entity-picker", FakeEntityPicker);
      await import("../solarbridge-card.js");
      const params = new URLSearchParams(location.search);
      const dark = params.get("theme") === "dark";
      const systemView = params.get("view") === "system";
      const theme = dark ? {
        "--page-background": "#111111",
        "--ha-card-background": "#1c1c1c",
        "--card-background-color": "#1c1c1c",
        "--primary-text-color": "#f1f1f1",
        "--secondary-text-color": "#b8b8b8",
        "--primary-color": "#03a9f4",
      } : {
        "--page-background": "#f2f4f5",
        "--ha-card-background": "#ffffff",
        "--card-background-color": "#ffffff",
        "--primary-text-color": "#212121",
        "--secondary-text-color": "#5f6368",
        "--primary-color": "#0288d1",
      };
      for (const [name, value] of Object.entries(theme)) document.documentElement.style.setProperty(name, value);
      document.documentElement.style.colorScheme = dark ? "dark" : "light";

      const ids = ["pv", "inverter", "battery", "soc", "load", "grid", "solar_day", "load_day", "import_day", "export_day"];
      const config = {
        view_mode: systemView ? "system" : "overview",
        title: "Solar power flow", pv_power: "sensor.pv", inverter_power: "sensor.inverter",
        battery_power: "sensor.battery", battery_soc: "sensor.soc", load_power: "sensor.load",
        grid_power: "sensor.grid", daily_solar: "sensor.solar_day", daily_load: "sensor.load_day",
        daily_grid_import: "sensor.import_day", daily_grid_export: "sensor.export_day",
      };
      const values = [0, 176, 209, 87, 224, 48, 0.9, 2.3, 2.6, 0];
      const states = Object.fromEntries(ids.map((id, index) => [`sensor.${id}`, { state: String(values[index]) }]));
      const detailValues = {
        pv1_power: ["320", "W"], pv1_voltage: ["310.2", "V"], pv1_current: ["1.1", "A"],
        pv2_power: ["250", "W"], pv2_voltage: ["305.8", "V"], pv2_current: ["0.8", "A"],
        inverter_voltage: ["230.1", "V"], inverter_current: ["2.5", "A"], running_status: ["   "],
        ac_temperature: ["42.1", "°C"], dc_temperature: ["39.4", "°C"], battery_voltage: ["52.4", "V"],
        battery_current: ["-16.4", "A"], battery_temperature: ["29.2", "°C"], daily_battery_charge: ["1.2", "kWh"],
        daily_battery_discharge: ["2.1", "kWh"], total_battery_charge: ["1024.5", "kWh"], total_battery_discharge: ["980.2", "kWh"],
        bms_charging_voltage: ["51.7", "V"], bms_discharge_voltage: ["0.0", "V"], bms_charge_current_limit: ["80", "A"],
        bms_discharge_current_limit: ["85", "A"], bms_soc: ["36", "%"], bms_voltage: ["49.65", "V"],
        bms_current: ["-1", "A"], bms_temperature: ["32.1", "°C"],
        grid_voltage: ["231.0", "V"], grid_current: ["0.22", "A"], grid_frequency: ["50.01", "Hz"], grid_status: ["On-grid"],
        load_voltage: ["230.6", "V"], load_frequency: ["50.00", "Hz"], internal_ct_power: ["48", "W"], external_ct_power: ["52", "W"],
        aux_power: ["0", "W"], total_solar: ["2400.3", "kWh"], total_load: ["2100.7", "kWh"],
        total_grid_import: ["600.1", "kWh"], total_grid_export: ["320.4", "kWh"],
      };
      if (systemView) {
        for (const [key, [state, unit]] of Object.entries(detailValues)) {
          const entityId = `sensor.detail_${key}`;
          config[key] = entityId;
          states[entityId] = { state, attributes: unit ? { unit_of_measurement: unit } : {} };
        }
      }
      let resolveHistory;
      let statisticsCalls = 0;
      const history = new Promise(resolve => { resolveHistory = resolve; });
      const makeHass = overrides => ({
        states: { ...states, ...overrides },
        callApi: async () => history,
        callWS: async () => {
          statisticsCalls += 1;
          return { "sensor.solar_day": [{ change: 0.1, sum: 100 }] };
        },
      });
      const card = document.querySelector("solarbridge-card");
      if (params.has("width")) card.style.width = `${Number(params.get("width"))}px`;
      card.setConfig(config);
      card.hass = makeHass();
      const editor = document.querySelector("solarbridge-card-editor");
      editor.setConfig(config);
      editor.hass = { states };
      const openPicker = editor.querySelector("ha-entity-picker");
      openPicker.menuOpen = true;
      openPicker.focus();
      editor.hass = { states: { ...states } };

      function rgb(value) {
        const numbers = value.match(/[\d.]+/g)?.map(Number) || [];
        if (value.startsWith("color(srgb")) return numbers.slice(0, 3).map(channel => channel * 255);
        return numbers.slice(0, 3);
      }
      function luminance(color) {
        return rgb(color).map(channel => channel / 255).map(channel => channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4)
          .reduce((sum, channel, index) => sum + channel * [.2126, .7152, .0722][index], 0);
      }
      function contrast(foreground, background) {
        const values = [luminance(foreground), luminance(background)].sort((a, b) => b - a);
        return (values[0] + .05) / (values[1] + .05);
      }
      const waitForUpdate = () => new Promise(resolve => setTimeout(resolve, 70));

      await new Promise(resolve => setTimeout(resolve, 250));
      const root = card.shadowRoot;
      const summaries = [...root.querySelectorAll(".summary div")];
      const lines = [...root.querySelectorAll(".line")];
      const pulses = lines.map(line => line.querySelector(".pulse"));
      const animations = pulses.map(pulse => pulse.getAnimations()[0]);
      const summaryBackground = getComputedStyle(root.querySelector("ha-card")).backgroundColor;
      const labelContrast = contrast(getComputedStyle(summaries[0].querySelector("small")).color, summaryBackground);
      const valueContrast = contrast(getComputedStyle(summaries[0].querySelector("b")).color, summaryBackground);
      const animationOffsets = [...root.querySelector("style").textContent.matchAll(/@keyframes flow\{to\{stroke-dashoffset:(-?\d+)/g)].map(match => Number(match[1]));
      const pulsePatterns = pulses.map(pulse => getComputedStyle(pulse).strokeDasharray);
      const fullConnectors = lines.every(line => line.querySelector(".pulse").getAttribute("d") === line.querySelector(".track").getAttribute("d") && line.querySelector(".pulse").getTotalLength() > 0);
      const summaryColumns = new Set(summaries.map(item => Math.round(item.getBoundingClientRect().left))).size;
      const hostWidth = Math.round(card.getBoundingClientRect().width);
      const battery = root.querySelector(".battery");
      const details = root.querySelector(".details");
      const visibleDetailRows = [...root.querySelectorAll(".metric-row")].filter(row => !row.hidden);
      const detailColumns = new Set([...root.querySelectorAll(".metric-group")].filter(group => !group.hidden).map(group => Math.round(group.getBoundingClientRect().left))).size;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const viewModeCorrect = systemView
        ? !details.hidden && visibleDetailRows.length === 39 && detailColumns === (hostWidth <= 480 ? 1 : 2)
          && root.querySelector('.metric-row[data-key="inverter_voltage"] dd').textContent === "230.1 V"
          && root.querySelector('.metric-row[data-key="bms_current"] dd').textContent === "-1 A"
          && root.querySelector('.metric-row[data-key="bms_temperature"] dd').textContent === "32.1 °C"
          && root.querySelector('.metric-row[data-key="running_status"] dd').getAttribute("aria-label") === "Running status: Unavailable"
          && root.querySelector(".inverter .flow-state").textContent === "Supplying"
          && root.querySelector(".battery .flow-state").textContent === "Discharging"
          && root.querySelector(".grid .flow-state").textContent === "Importing"
        : details.hidden && !root.querySelector(".pv .flow-state").hidden && root.querySelector(".inverter strong").hidden;
      const lifecycle = {};
      const semantics = {};

      const expectedLabels = {
        pv: ["Generating", "Reverse flow", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        inverter: ["Supplying", "Absorbing", "Standby", "Standby", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        grid: ["Importing", "Exporting", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        battery: ["Discharging", "Charging", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        load: ["Consuming", "Reverse flow", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
      };
      const labelCases = ["12", "-12", "0", "0.5", "unknown", "unavailable", "", "   "];
      semantics.labelTruthTable = true;
      for (const [index, state] of labelCases.entries()) {
        card.hass = makeHass(Object.fromEntries(["pv", "inverter", "grid", "battery", "load"].map(id => [`sensor.${id}`, { state }])));
        await waitForUpdate();
        for (const [node, labels] of Object.entries(expectedLabels)) {
          semantics.labelTruthTable &&= root.querySelector(`.${node} .flow-state`).textContent === labels[index];
        }
      }
      card.hass = makeHass();
      await waitForUpdate();
      semantics.screenshotCase = root.querySelector(".pv strong").textContent === "0 W"
        && root.querySelector(".inverter strong").textContent === "176 W"
        && root.querySelector(".battery-power").textContent === "209 W"
        && root.querySelector(".battery-soc-value").textContent === "87%"
        && root.querySelector(".grid strong").textContent === "48 W"
        && root.querySelector(".load strong").textContent === "224 W"
        && root.querySelector(".inverter .flow-state").textContent === "Supplying"
        && root.querySelector(".battery .flow-state").textContent === "Discharging";
      const stableAnimations = pulses.map(pulse => pulse.getAnimations()[0]);
      card.hass = makeHass({ "sensor.inverter": { state: "unavailable" } });
      await waitForUpdate();
      semantics.configuredInverterUnavailable = root.querySelector(".inverter strong").textContent === "—"
        && root.querySelector(".inverter .flow-state").textContent === "Unavailable";
      const fallbackConfig = { ...config };
      delete fallbackConfig.inverter_power;
      card.setConfig(fallbackConfig);
      card.hass = makeHass({ "sensor.pv": { state: "345" } });
      await waitForUpdate();
      semantics.omittedInverterHidden = root.querySelector(".inverter").hidden
        && root.querySelector(".pv-line").hidden;
      semantics.semanticUpdatesPreserveIdentity = stableAnimations.every((animation, index) => pulses[index].getAnimations()[0] === animation);
      card.setConfig(config);
      card.hass = makeHass();
      await waitForUpdate();

      const openedEntities = [];
      card.addEventListener("hass-more-info", event => openedEntities.push(event.detail.entityId));
      root.querySelector('.summary [data-key="daily_solar"]').click();
      root.querySelector(".pv").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, composed: true }));
      semantics.detailsPopup = openedEntities.join(",") === "sensor.solar_day,sensor.pv";

      card.hass = makeHass({ "sensor.battery": { state: "-209" }, "sensor.grid": { state: "unavailable" } });
      await waitForUpdate();
      semantics.valueColors = root.querySelector(".inverter strong").dataset.valueTone === "positive"
        && root.querySelector(".battery-power").dataset.valueTone === "negative"
        && root.querySelector(".pv strong").dataset.valueTone === "idle"
        && root.querySelector(".grid strong").dataset.valueTone === "unavailable";

      card.setConfig({ pv_power: config.pv_power });
      card.hass = makeHass();
      await waitForUpdate();
      semantics.unassignedHidden = !root.querySelector(".pv").hidden
        && root.querySelector(".inverter").hidden
        && root.querySelector(".battery").hidden
        && root.querySelector(".grid").hidden
        && root.querySelector(".load").hidden
        && root.querySelector(".soc").hidden
        && root.querySelector(".summary").hidden
        && [...root.querySelectorAll(".line")].every(line => line.hidden);
      card.setConfig(config);
      card.hass = makeHass();
      await waitForUpdate();

      if (reducedMotion) {
        card.hass = makeHass({ "sensor.pv": { state: "0.5" } });
        await waitForUpdate();
        const inactive = getComputedStyle(pulses[0]).visibility === "hidden";
        card.hass = makeHass({ "sensor.pv": { state: "1200" } });
        await waitForUpdate();
        lifecycle.reducedMotion = animations.every(animation => animation == null)
          && inactive && getComputedStyle(pulses[0]).visibility === "visible";
      } else {
        let renderCalls = 0;
        const render = card.render.bind(card);
        card.render = () => { renderCalls += 1; return render(); };
        card.hass = makeHass({ "sensor.unrelated": { state: "changed" } });
        await waitForUpdate();
        lifecycle.unrelatedUpdateFiltered = renderCalls === 0;

        const beforeRefresh = animations.map(animation => animation.currentTime);
        card.hass = makeHass({ "sensor.load_day": { state: "2.4" } });
        card.hass = makeHass({ "sensor.load_day": { state: "2.5" } });
        await waitForUpdate();
        lifecycle.updatesCoalesced = renderCalls === 1;
        lifecycle.refreshIdentity = lines.every((line, index) => root.querySelectorAll(".line")[index] === line)
          && pulses.every((pulse, index) => root.querySelectorAll(".line .pulse")[index] === pulse)
          && animations.every((animation, index) => pulses[index].getAnimations()[0] === animation);
        lifecycle.refreshContinuity = animations.every((animation, index) => Math.abs(animation.currentTime - beforeRefresh[index]) < 100);

        const pvAnimation = animations[0];
        const beforeSpeed = pvAnimation.currentTime;
        card.hass = makeHass({ "sensor.pv": { state: "1200" } });
        await waitForUpdate();
        lifecycle.speedPhaseContinuous = pvAnimation === pulses[0].getAnimations()[0]
          && Math.abs(pvAnimation.currentTime - beforeSpeed) < 100;
        lifecycle.speedChanged = Math.abs(pvAnimation.playbackRate - (1 / 1.5)) < .001;

        const beforeReverse = pvAnimation.currentTime;
        card.hass = makeHass({ "sensor.pv": { state: "-1200" } });
        await waitForUpdate();
        const reversePhaseDelta = Math.abs((pvAnimation.currentTime % 1000) - (beforeReverse % 1000));
        lifecycle.reversePhaseContinuous = pvAnimation === pulses[0].getAnimations()[0]
          && Math.min(reversePhaseDelta, 1000 - reversePhaseDelta) < 100;
        lifecycle.directionChanged = pvAnimation.playbackRate < 0;

        card.hass = makeHass({ "sensor.pv": { state: "0.5" } });
        await waitForUpdate();
        const inactive = getComputedStyle(pulses[0]).visibility === "hidden";
        card.hass = makeHass({ "sensor.pv": { state: "100" } });
        await waitForUpdate();
        lifecycle.activeThreshold = inactive && getComputedStyle(pulses[0]).visibility === "visible"
          && pulses[0].getAnimations()[0] === pvAnimation;

        const historyNow = Date.now();
        resolveHistory([[
          { state: "10", last_changed: new Date(historyNow - 20 * 60 * 60 * 1000).toISOString() },
          { state: "15", last_changed: new Date(historyNow - 8 * 60 * 60 * 1000).toISOString() },
        ]]);
        await new Promise(resolve => setTimeout(resolve, 100));
        const trendLine = root.querySelector(".trend-line").getAttribute("d");
        const trendArea = root.querySelector(".trend-area").getAttribute("d");
        lifecycle.historyIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && trendLine.startsWith("M ") && trendLine.includes(" C ")
          && trendArea.startsWith(trendLine) && trendArea.endsWith(" Z");

        card.setConfig({ ...config, title: "Updated solar power flow" });
        await waitForUpdate();
        lifecycle.configIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && root.querySelector("h2").textContent === "Updated solar power flow";

        card.setConfig({ ...config, view_mode: systemView ? "overview" : "system" });
        await waitForUpdate();
        lifecycle.modeSwitchIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && details.hidden === systemView;

        card._intersecting = false;
        card.syncAnimationPlayback();
        const paused = animations.every(animation => animation.playState === "paused");
        card._intersecting = true;
        card.syncAnimationPlayback();
        lifecycle.offscreenPauseResume = paused && animations.every(animation => animation.playState === "running");
        lifecycle.expectedDirections = animations.map(animation => Math.sign(animation.playbackRate)).join(",") === "1,-1,1,1";

        // Hiding a dashboard destroys CSS animations, but not the connector DOM.
        card.hass = makeHass({ "sensor.battery": { state: "-209" } });
        await waitForUpdate();
        const batteryPulse = pulses[2];
        const oldBatteryAnimation = batteryPulse.getAnimations()[0];
        card.style.display = "none";
        void card.offsetWidth;
        card.style.display = "";
        void card.offsetWidth;
        card.hass = makeHass({ "sensor.battery": { state: "-209" }, "sensor.load_day": { state: "3.1" } });
        await waitForUpdate();
        const recreated = batteryPulse.getAnimations()[0];
        lifecycle.recreatedChargingDirection = recreated !== oldBatteryAnimation && recreated.playbackRate < 0;
        card.hass = makeHass({ "sensor.battery": { state: "209" } });
        await waitForUpdate();
        lifecycle.recreatedDischargingDirection = recreated.playbackRate > 0;
      }
      const modeConfig = {
        ...config, view_mode: "system", battery_mode: "sensor.mode", battery_voltage: "sensor.voltage",
        battery_shutdown_voltage: "sensor.shutdown_v", battery_restart_voltage: "sensor.restart_v",
        battery_low_voltage: "sensor.low_v", battery_shutdown_soc: "sensor.shutdown_soc",
        battery_restart_soc: "sensor.restart_soc", battery_low_soc: "sensor.low_soc", bms_soc: "sensor.bms",
      };
      const modeStates = {
        "sensor.mode": { state: "Voltage" }, "sensor.voltage": { state: "51.27", attributes: { unit_of_measurement: "V" } },
        "sensor.shutdown_v": { state: "44", attributes: { unit_of_measurement: "V" } },
        "sensor.restart_v": { state: "50.5", attributes: { unit_of_measurement: "V" } },
        "sensor.low_v": { state: "47", attributes: { unit_of_measurement: "V" } },
        "sensor.shutdown_soc": { state: "10", attributes: { unit_of_measurement: "%" } },
        "sensor.restart_soc": { state: "25", attributes: { unit_of_measurement: "%" } },
        "sensor.low_soc": { state: "20", attributes: { unit_of_measurement: "%" } }, "sensor.bms": { state: "99" },
      };
      const modeHass = overrides => makeHass({ ...modeStates, ...overrides });
      const row = key => root.querySelector(`.metric-row[data-key="${key}"]`);
      card.setConfig(modeConfig);
      card.hass = modeHass();
      await waitForUpdate();
      semantics.voltageMode = root.querySelector(".battery-soc-value").textContent === "51.27 V"
        && root.querySelector(".soc>div>b").textContent === "51.27 V" && root.querySelector(".gauge").hidden
        && root.querySelector(".trendbox small").textContent === "Battery voltage · 24h"
        && !row("battery_shutdown_voltage").hidden && row("battery_shutdown_voltage").querySelector("dd").textContent === "44 V"
        && row("battery_shutdown_soc").hidden && row("bms_soc").hidden
        && battery.scrollWidth <= battery.clientWidth;
      root.querySelector(".soc").click();
      semantics.voltageMoreInfo = openedEntities.at(-1) === "sensor.voltage";
      card.hass = modeHass({ "sensor.mode": { state: "Capacity" } });
      await waitForUpdate();
      semantics.liveCapacitySwitch = root.querySelector(".battery-soc-value").textContent === "87%"
        && !root.querySelector(".gauge").hidden && !row("battery_shutdown_soc").hidden
        && row("battery_shutdown_voltage").hidden && !row("bms_soc").hidden;
      card.hass = modeHass({ "sensor.mode": { state: "No battery" } });
      await waitForUpdate();
      semantics.noBatteryMode = battery.hidden && lines[2].hidden && root.querySelector(".soc").hidden
        && getComputedStyle(pulses[2]).visibility === "hidden";
      card.hass = modeHass({ "sensor.mode": { state: "unavailable" } });
      await waitForUpdate();
      semantics.unknownMode = root.querySelector(".soc").hidden && root.querySelector(".battery-soc").hidden
        && root.querySelector(".battery-mode").textContent === "Mode unavailable";

      const attributeConfig = { ...modeConfig };
      delete attributeConfig.battery_mode;
      card.setConfig(attributeConfig);
      card.hass = modeHass();
      await waitForUpdate();
      card.hass = modeHass({ "sensor.voltage": { state: "51.27", attributes: { unit_of_measurement: "V", battery_mode: "Voltage" } } });
      await waitForUpdate();
      semantics.attributeModeUpdate = root.querySelector(".battery-soc-value").textContent === "51.27 V";
      card.hass = modeHass({ "sensor.voltage": { state: "unavailable", attributes: { battery_mode: "Voltage" } } });
      await waitForUpdate();
      semantics.unavailableVoltage = root.querySelector(".battery-soc-value").textContent === "— V"
        && root.querySelector(".battery-soc-value").dataset.valueTone === "unavailable";

      // A delayed SOC response must not overwrite the graph after switching to volts.
      const pendingHistory = new Map();
      const historyHass = overrides => ({ ...modeHass(overrides), callApi: (_, path) => new Promise(resolve => {
        pendingHistory.set(new URL(`http://localhost/${path}`).searchParams.get("filter_entity_id"), resolve);
      }) });
      card.setConfig({ ...modeConfig, battery_soc: "sensor.other_soc" });
      card.hass = historyHass({ "sensor.mode": { state: "Capacity" } });
      await waitForUpdate();
      card.hass = historyHass();
      await waitForUpdate();
      const historyPoint = (value, hours = 1) => ({ state: String(value), last_changed: new Date(Date.now() - hours * 3600000).toISOString() });
      pendingHistory.get("sensor.other_soc")([ [historyPoint(5), historyPoint(95)] ]);
      await waitForUpdate();
      semantics.staleSocHistoryIgnored = !root.querySelector(".trend-line").getAttribute("d").includes(" C ");
      pendingHistory.get("sensor.voltage")([ [historyPoint(49.2, 20), historyPoint(50.1, 8)] ]);
      await waitForUpdate();
      semantics.voltageHistoryLoaded = root.querySelector(".trend-line").getAttribute("d").includes(" C ");

      const dailyValuesRaw = summaries.map(item => item.querySelector("b").textContent).join(",") === "0.9 kWh,2.3 kWh,2.6 kWh,0.0 kWh" && statisticsCalls === 0;
      const captured = {
        "sensor.pv": { state: "91" }, "sensor.inverter": { state: "-153" },
        "sensor.grid": { state: "608" }, "sensor.battery": { state: "-243" },
        "sensor.load": { state: "455" }, "sensor.voltage": { state: "50.88", attributes: { unit_of_measurement: "V" } },
      };
      const redesign = {};
      for (const style of ["hub", "minimal", "horizontal"]) {
        for (const display of ["compact", "detailed"]) {
          card.setConfig({ ...modeConfig, display_mode: display, flow_style: style });
          card.hass = modeHass(captured);
          await waitForUpdate();
          const visible = element => !element.hidden && getComputedStyle(element).display !== "none";
          redesign[`${style}-${display}-captured`] = root.querySelector(".pv strong").textContent === "91 W"
            && root.querySelector(".grid strong").textContent === "608 W"
            && root.querySelector(".load strong").textContent === "455 W"
            && root.querySelector(".battery-power").textContent === "243 W"
            && root.querySelector(".battery .flow-state").textContent === "Charging"
            && root.querySelector(".grid .flow-state").textContent === "Importing"
            && details.hidden === (display === "compact")
            && visible(root.querySelector(".soc")) === (display === "detailed")
            && visible(root.querySelector(style === "hub" ? ".inverter strong" : ".inverter-reading")) === (display === "detailed")
            && root.querySelector(".inverter strong").textContent === "-153 W"
            && row("bms_soc").hidden
            && root.querySelector(".bar-label b").textContent === "699 W";
          redesign[`${style}-${display}-contrast`] = ["pv", "grid", "battery", "load"].every(name => contrast(getComputedStyle(root.querySelector(`.node.${name} .flow-state`)).color, summaryBackground) >= 4.5);
          redesign[`${style}-${display}-layout`] = root.querySelector("ha-card").scrollWidth <= hostWidth
            && [...root.querySelectorAll(".node:not(.inverter)")].every(node => {
              const value = node.querySelector("strong").getBoundingClientRect(), box = node.getBoundingClientRect();
              const state = node.querySelector(".flow-state").getBoundingClientRect(), cardBox = card.getBoundingClientRect();
              return value.left >= box.left && value.right <= box.right && state.left >= cardBox.left && state.right <= cardBox.right;
            });
          if (style !== "minimal") {
            const rate = index => pulses[index].getAnimations()[0]?.playbackRate;
            const arrows = lines.map(line => line.querySelector(".arrow").getAttribute("transform"));
            const directions = reducedMotion || (rate(0) > 0 && rate(1) < 0 && rate(2) < 0 && rate(3) > 0);
            card.hass = modeHass({ ...captured, "sensor.grid": { state: "-900" }, "sensor.battery": { state: "380" } });
            await waitForUpdate();
            redesign[`${style}-${display}-reverse`] = directions && (reducedMotion || (rate(1) > 0 && rate(2) > 0))

              && root.querySelector(".battery .flow-state").textContent === "Discharging";
            if (!reducedMotion) {
              card.style.display = "none"; void card.offsetWidth;
              card.style.display = ""; void card.offsetWidth;
              card.hass = modeHass(captured);
              await waitForUpdate();
              redesign[`${style}-${display}-recreated`] = rate(1) < 0 && rate(2) < 0;
            }
          }
          card.hass = modeHass({ ...captured, "sensor.grid": { state: "0" }, "sensor.battery": { state: "unavailable" } });
          await waitForUpdate();
          redesign[`${style}-${display}-idle-unavailable`] = !lines[1].classList.contains("active") && !lines[2].classList.contains("active")
            && root.querySelector(".grid .flow-state").textContent === "Idle" && root.querySelector(".grid strong").textContent === "0 W"
            && root.querySelector(".battery .flow-state").textContent === "Unavailable" && root.querySelector(".battery-power").textContent === "—"
            && root.querySelector(".bar-label b").textContent === "91 W known";
        }
      }
      card.setConfig({ ...modeConfig, display_mode: "compact", flow_style: "minimal" });
      card.hass = modeHass({ ...captured, "sensor.pv": { state: "0" }, "sensor.grid": { state: "120" }, "sensor.battery": { state: "380" } });
      await waitForUpdate();
      redesign.incomingIncludesDischarge = root.querySelector(".bar-label b").textContent === "500 W";
      card.hass = modeHass({ ...captured, "sensor.pv": { state: "0" }, "sensor.grid": { state: "0" }, "sensor.battery": { state: "0" } });
      await waitForUpdate();
      redesign.zeroIncomingIsZero = root.querySelector(".bar-label b").textContent === "0 W";
      card.setConfig({ display_mode: "detailed", pv1_voltage: config.pv_power, aux_power: config.grid_power });
      card.hass = modeHass(captured);
      await waitForUpdate();
      redesign.partialDetails = !details.hidden && [...root.querySelectorAll(".metric-group")].filter(group => !group.hidden).length === 2
        && !row("pv1_voltage").hidden && !row("aux_power").hidden && row("inverter_voltage").hidden;
      const toggleConfig = { ...modeConfig, display_mode: "auto", flow_style: "minimal", show_mode_toggle: true };
      card.setConfig(toggleConfig);
      card.hass = modeHass(captured);
      await waitForUpdate();
      let configEvents = 0;
      card.addEventListener("config-changed", () => configEvents++);
      root.querySelector('[data-mode="compact"]').click();
      await waitForUpdate();
      const secondCard = document.createElement("solarbridge-card");
      secondCard.setConfig({ ...toggleConfig, title: "Same sensors, another title" });
      secondCard.hass = modeHass(captured);
      document.body.append(secondCard);
      await waitForUpdate();
      redesign.togglePersistsWithoutYaml = details.hidden && secondCard.shadowRoot.querySelector(".details").hidden
        && secondCard.shadowRoot.querySelector('[data-mode="compact"]').getAttribute("aria-pressed") === "true"
        && configEvents === 0 && root.querySelector("ha-card").dataset.style === "minimal";
      secondCard.remove();
      card.setConfig({ ...toggleConfig, show_mode_toggle: false });
      await waitForUpdate();
      redesign.toggleOffIgnoresPreference = root.querySelector(".mode-toggle").hidden && !details.hidden;
      localStorage.clear();
      card.setConfig(toggleConfig);
      await waitForUpdate();
      const save = Storage.prototype.setItem;
      Storage.prototype.setItem = () => { throw new Error("Storage disabled"); };
      root.querySelector('[data-mode="compact"]').click();
      await waitForUpdate();
      redesign.toggleWorksWithoutStorage = details.hidden;
      Storage.prototype.setItem = save;

      const beforeTheme = getComputedStyle(root.querySelector(".grid .flow-state")).color;
      card.hass = { ...modeHass(captured), themes: { darkMode: !dark } };
      redesign.liveTheme = card.style.colorScheme === (dark ? "light" : "dark") && getComputedStyle(root.querySelector(".grid .flow-state")).color !== beforeTheme;
      card.hass = { ...modeHass(captured), themes: { darkMode: dark } };

      card.setConfig({ ...modeConfig, display_mode: "detailed" });
      const batteryDetails = root.querySelector('.metric-group[data-group="Battery"]');
      batteryDetails.open = false;
      batteryDetails.querySelector("summary").click();
      card.hass = modeHass(captured);
      await waitForUpdate();
      redesign.expandableDetailsKeepUserChoice = batteryDetails.open && row("battery_voltage").querySelector("dd").textContent === "50.88 V";
      batteryDetails.open = hostWidth > 480;

      let historyRequest;
      card.setConfig({ ...modeConfig, display_mode: "detailed", battery_voltage: "sensor.gap_voltage" });
      card.hass = { ...modeHass({ "sensor.gap_voltage": { state: "50.88" } }), callApi: async (method, path) => {
        historyRequest = { method, path };
        return [[historyPoint(49.1, 23), historyPoint(49.8, 18), historyPoint("unavailable", 12), historyPoint(50.2, 6)]];
      } };
      await waitForUpdate();
      redesign.realHistoryContractWithGap = historyRequest.method === "GET" && historyRequest.path.startsWith("history/period/")
        && historyRequest.path.includes("filter_entity_id=sensor.gap_voltage") && historyRequest.path.includes("end_time=")
        && (root.querySelector(".trend-line").getAttribute("d").match(/M /g) || []).length === 2
        && [...root.querySelectorAll(".chart-axes text")].filter(text => text.textContent.includes(" V")).length === 3
        && [...root.querySelectorAll(".chart-axes text")].filter(text => text.textContent.includes(":")).length === (hostWidth <= 480 ? 3 : 5);
      const timeLabels = [...root.querySelectorAll(".chart-axes text")].filter(text => text.textContent.includes(":"));
      redesign.readableHistoryTimestamps = timeLabels.every((label, index) => index === 0 || timeLabels[index - 1].getBoundingClientRect().right < label.getBoundingClientRect().left)
        && timeLabels[0].querySelector("tspan") && timeLabels.at(-1).querySelector("tspan") ? true : false;
      let editedConfig;
      editor.addEventListener("config-changed", event => { editedConfig = event.detail.config; });
      for (const [key, value] of [["display_mode", "compact"], ["flow_style", "horizontal"], ["show_mode_toggle", "true"]]) {
        const field = editor.querySelector(`select[data-key="${key}"]`);
        field.value = value;
        field.dispatchEvent(new Event("change"));
        redesign[`editor-${key}`] = editedConfig[key] === (key === "show_mode_toggle" ? true : value) && editedConfig.grid_power === config.grid_power;
      }

      const batteryPreview = params.get("battery");
      const modePreview = ["voltage", "unknown", "none", "missing"].includes(batteryPreview);
      card.setConfig(modePreview ? { ...modeConfig, view_mode: config.view_mode } : config);
      const previewStates = batteryPreview === "unknown" ? { "sensor.mode": { state: "unavailable" } }
        : batteryPreview === "none" ? { "sensor.mode": { state: "No battery" } }
        : batteryPreview === "missing" ? { "sensor.voltage": { state: "unavailable" } } : {};
      card.hass = modePreview ? modeHass(previewStates) : makeHass();
      await waitForUpdate();
      if (params.get("battery") === "voltage") {
        const valueBounds = root.querySelector(".battery-soc-value").getBoundingClientRect();
        const batteryBounds = battery.getBoundingClientRect();
        semantics.voltageValueContained = valueBounds.left >= batteryBounds.left && valueBounds.right <= batteryBounds.right;
      }
      if (params.has("display")) {
        const previewReadings = {
          pv1_power: "91", pv1_voltage: "141.1", pv1_current: "0.6", pv2_power: "0", pv2_voltage: "1.6", pv2_current: "0.0",
          inverter_voltage: "220.7", inverter_current: "1.0", running_status: "Normal", ac_temperature: "40.9", dc_temperature: "44.2",
          battery_voltage: "50.88", battery_current: "-4.78", battery_temperature: "25.0", daily_battery_charge: "7.8", daily_battery_discharge: "1.7",
          total_battery_charge: "671.2", total_battery_discharge: "599.8", grid_voltage: "220.7", grid_current: "2.97", grid_frequency: "50.03",
          grid_status: "On-grid", load_voltage: "222.0", load_frequency: "50.03", internal_ct_power: "608", external_ct_power: "620",
          aux_power: "0", total_solar: "1234.1", total_load: "2232.1", total_grid_import: "1207.2", total_grid_export: "0.2",
        };
        const detailOverrides = Object.fromEntries(Object.entries(previewReadings).filter(([key]) => config[key]).map(([key, state]) => [config[key], { ...states[config[key]], state }]));
        const scenario = params.get("scenario");
        const scenarioStates = scenario === "export" ? { "sensor.pv": { state: "3200" }, "sensor.grid": { state: "-900" }, "sensor.battery": { state: "-1400" }, "sensor.load": { state: "900" } }
          : scenario === "night" ? { "sensor.pv": { state: "0" }, "sensor.grid": { state: "120" }, "sensor.battery": { state: "380" }, "sensor.load": { state: "500" } }
          : scenario === "unavailable" ? { "sensor.grid": { state: "unavailable" } }
          : scenario === "zero" ? Object.fromEntries(["pv", "grid", "battery", "load"].map(key => [`sensor.${key}`, { state: "0" }])) : {};
        card.setConfig({ ...modeConfig, title: "SolarBridge", view_mode: config.view_mode, display_mode: params.get("display"), flow_style: params.get("style") || "hub", show_mode_toggle: params.get("toggle") !== "off", battery_voltage: "sensor.preview_voltage" });
        card.hass = { ...modeHass({ ...detailOverrides, ...captured, ...scenarioStates,
          "sensor.preview_voltage": { state: "50.88", attributes: { unit_of_measurement: "V" } },
          "sensor.solar_day": { state: "8.6" }, "sensor.load_day": { state: "9.4" }, "sensor.import_day": { state: "7.6" }, "sensor.export_day": { state: "0" },
          "sensor.shutdown_v": { state: "45.5", attributes: { unit_of_measurement: "V" } },
          "sensor.restart_v": { state: "48.0", attributes: { unit_of_measurement: "V" } },
          "sensor.low_v": { state: "47.0", attributes: { unit_of_measurement: "V" } },
        }), callApi: async () => [Array.from({ length: 97 }, (_, index) => {
          const value = index >= 88 ? 49.23 + (index - 88) / 8 * 1.65 : 50.2 + 1.6 * Math.sin((index - 30) / 96 * Math.PI * 2) - (index === 61 ? 1.1 : 0);
          return historyPoint(index >= 70 && index <= 74 ? "unavailable" : value, 24 - index / 4);
        })] };
        await waitForUpdate();
        if (params.get("expand") === "all") root.querySelectorAll(".metric-group").forEach(group => { group.open = true; });
      }
      const tests = {
        labelContrast: labelContrast >= 4.5,
        valueContrast: valueContrast >= 4.5,
        seamlessLoopOffset: animationOffsets.join(",") === "-68" && animationOffsets.every(offset => Math.abs(offset) % 34 === 0),
        seamlessPattern: pulsePatterns.every(value => value === "14px, 20px"),
        fullConnectorPulse: fullConnectors,
        responsiveColumns: summaryColumns === (hostWidth <= 480 ? 2 : 4),
        noHorizontalOverflow: root.querySelector("ha-card").scrollWidth <= hostWidth,
        batteryValueContained: battery.scrollWidth <= battery.clientWidth,
        dailyValuesRaw,
        editorDropdownPreserved: editor.querySelector("ha-entity-picker") === openPicker && openPicker.menuOpen && document.activeElement === openPicker,
        editorEntityInventory: editor.querySelectorAll("ha-entity-picker").length === 57 && editor.querySelector('[data-key="view_mode"]').value === (systemView ? "system" : "overview"),
        viewMode: viewModeCorrect,
        ...semantics,
        ...lifecycle,
        ...redesign,
      };
      document.querySelector("#result").textContent = JSON.stringify({
        theme: dark ? "dark" : "light", width: innerWidth, tests,
        contrast: { label: labelContrast.toFixed(2), value: valueContrast.toFixed(2) }, animationOffsets,
      });
    </script>
