<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; background: var(--page-background); }
      solarbridge-card { width: 100%; max-width: 500px; }
      solarbridge-card-editor { position: fixed; left: -10000px; }
      #result { display: none; }
    </style>
  </head>
  <body>
    <solarbridge-card></solarbridge-card>
    <solarbridge-card-editor></solarbridge-card-editor>
    <pre id="result">pending</pre>
    <script type="module">
      class FakeEntityPicker extends HTMLElement {
        connectedCallback() { this.tabIndex = 0; }
      }
      customElements.define("ha-entity-picker", FakeEntityPicker);
      await import("../solarbridge-card.js");
      const playbackRateRequests = new WeakMap();
      const updatePlaybackRate = Animation.prototype.updatePlaybackRate;
      Animation.prototype.updatePlaybackRate = function(rate) {
        playbackRateRequests.set(this, rate);
        return updatePlaybackRate.call(this, rate);
      };

      const params = new URLSearchParams(location.search);
      const dark = params.get("theme") === "dark";
      const systemView = params.get("view") === "system";
      const theme = dark ? {
        "--page-background": "#111111",
        "--ha-card-background": "#1c1c1c",
        "--card-background-color": "#1c1c1c",
        "--primary-text-color": "#f1f1f1",
        "--secondary-text-color": "#b8b8b8",
        "--primary-color": "#03a9f4",
      } : {
        "--page-background": "#f2f4f5",
        "--ha-card-background": "#ffffff",
        "--card-background-color": "#ffffff",
        "--primary-text-color": "#212121",
        "--secondary-text-color": "#5f6368",
        "--primary-color": "#0288d1",
      };
      for (const [name, value] of Object.entries(theme)) document.documentElement.style.setProperty(name, value);

      const ids = ["pv", "inverter", "battery", "soc", "load", "grid", "solar_day", "load_day", "import_day", "export_day"];
      const config = {
        view_mode: systemView ? "system" : "overview",
        title: "Solar power flow", pv_power: "sensor.pv", inverter_power: "sensor.inverter",
        battery_power: "sensor.battery", battery_soc: "sensor.soc", load_power: "sensor.load",
        grid_power: "sensor.grid", daily_solar: "sensor.solar_day", daily_load: "sensor.load_day",
        daily_grid_import: "sensor.import_day", daily_grid_export: "sensor.export_day",
      };
      const values = [0, 176, 209, 87, 224, 48, 0.9, 2.3, 2.6, 0];
      const states = Object.fromEntries(ids.map((id, index) => [`sensor.${id}`, { state: String(values[index]) }]));
      const detailValues = {
        pv1_power: ["320", "W"], pv1_voltage: ["310.2", "V"], pv1_current: ["1.1", "A"],
        pv2_power: ["250", "W"], pv2_voltage: ["305.8", "V"], pv2_current: ["0.8", "A"],
        inverter_voltage: ["230.1", "V"], inverter_current: ["2.5", "A"], running_status: ["   "],
        ac_temperature: ["42.1", "°C"], dc_temperature: ["39.4", "°C"], battery_voltage: ["52.4", "V"],
        battery_current: ["-16.4", "A"], battery_temperature: ["29.2", "°C"], daily_battery_charge: ["1.2", "kWh"],
        daily_battery_discharge: ["2.1", "kWh"], total_battery_charge: ["1024.5", "kWh"], total_battery_discharge: ["980.2", "kWh"],
        grid_voltage: ["231.0", "V"], grid_current: ["0.22", "A"], grid_frequency: ["50.01", "Hz"], grid_status: ["On-grid"],
        load_voltage: ["230.6", "V"], load_frequency: ["50.00", "Hz"], internal_ct_power: ["48", "W"], external_ct_power: ["52", "W"],
        aux_power: ["0", "W"], total_solar: ["2400.3", "kWh"], total_load: ["2100.7", "kWh"],
        total_grid_import: ["600.1", "kWh"], total_grid_export: ["320.4", "kWh"],
      };
      if (systemView) {
        for (const [key, [state, unit]] of Object.entries(detailValues)) {
          const entityId = `sensor.detail_${key}`;
          config[key] = entityId;
          states[entityId] = { state, attributes: unit ? { unit_of_measurement: unit } : {} };
        }
      }
      let resolveHistory;
      let statisticsCalls = 0;
      const history = new Promise(resolve => { resolveHistory = resolve; });
      const makeHass = overrides => ({
        states: { ...states, ...overrides },
        callApi: async () => history,
        callWS: async () => {
          statisticsCalls += 1;
          return { "sensor.solar_day": [{ change: 0.1, sum: 100 }] };
        },
      });
      const card = document.querySelector("solarbridge-card");
      card.setConfig(config);
      card.hass = makeHass();
      const editor = document.querySelector("solarbridge-card-editor");
      editor.setConfig(config);
      editor.hass = { states };
      const openPicker = editor.querySelector("ha-entity-picker");
      openPicker.menuOpen = true;
      openPicker.focus();
      editor.hass = { states: { ...states } };

      function rgb(value) {
        const numbers = value.match(/[\d.]+/g)?.map(Number) || [];
        if (value.startsWith("color(srgb")) return numbers.slice(0, 3).map(channel => channel * 255);
        return numbers.slice(0, 3);
      }
      function luminance(color) {
        return rgb(color).map(channel => channel / 255).map(channel => channel <= .04045 ? channel / 12.92 : ((channel + .055) / 1.055) ** 2.4)
          .reduce((sum, channel, index) => sum + channel * [.2126, .7152, .0722][index], 0);
      }
      function contrast(foreground, background) {
        const values = [luminance(foreground), luminance(background)].sort((a, b) => b - a);
        return (values[0] + .05) / (values[1] + .05);
      }
      const waitForUpdate = () => new Promise(resolve => setTimeout(resolve, 70));

      await new Promise(resolve => setTimeout(resolve, 250));
      const root = card.shadowRoot;
      const summaries = [...root.querySelectorAll(".summary div")];
      const lines = [...root.querySelectorAll(".line")];
      const pulses = lines.map(line => line.querySelector("i"));
      const animations = pulses.map(pulse => pulse.getAnimations()[0]);
      const summaryBackground = getComputedStyle(summaries[0]).backgroundColor;
      const labelContrast = contrast(getComputedStyle(summaries[0].querySelector("small")).color, summaryBackground);
      const valueContrast = contrast(getComputedStyle(summaries[0].querySelector("b")).color, summaryBackground);
      const animationOffsets = [...root.querySelector("style").textContent.matchAll(/@keyframes flow\{to\{transform:translateX\((-?\d+)px/g)].map(match => Number(match[1]));
      const pulseBackgrounds = lines.map(line => getComputedStyle(line.querySelector("i")).backgroundImage);
      const pulseWidths = lines.map(line => [line.clientWidth, line.querySelector("i").clientWidth]);
      const summaryColumns = new Set(summaries.map(item => Math.round(item.getBoundingClientRect().left))).size;
      const hostWidth = Math.round(card.getBoundingClientRect().width);
      const battery = root.querySelector(".battery");
      const details = root.querySelector(".details");
      const visibleDetailRows = [...root.querySelectorAll(".metric-row")].filter(row => !row.hidden);
      const detailColumns = new Set([...root.querySelectorAll(".metric-group")].filter(group => !group.hidden).map(group => Math.round(group.getBoundingClientRect().left))).size;
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const viewModeCorrect = systemView
        ? !details.hidden && visibleDetailRows.length === 31 && detailColumns === (innerWidth <= 450 ? 1 : 2)
          && root.querySelector('.metric-row[data-key="inverter_voltage"] dd').textContent === "230.1 V"
          && root.querySelector('.metric-row[data-key="running_status"] dd').getAttribute("aria-label") === "Running status: Unavailable"
          && root.querySelector(".inverter .flow-state").textContent === "Supplying"
          && root.querySelector(".battery .flow-state").textContent === "Discharging"
          && root.querySelector(".grid .flow-state").textContent === "Importing"
        : details.hidden && getComputedStyle(root.querySelector(".pv .flow-state")).display === "none";
      const lifecycle = {};
      const semantics = {};

      const expectedLabels = {
        pv: ["Generating", "Reverse flow", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        inverter: ["Supplying", "Absorbing", "Standby", "Standby", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        grid: ["Importing", "Exporting", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        battery: ["Discharging", "Charging", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
        load: ["Consuming", "Reverse flow", "Idle", "Idle", "Unavailable", "Unavailable", "Unavailable", "Unavailable"],
      };
      const labelCases = ["12", "-12", "0", "0.5", "unknown", "unavailable", "", "   "];
      semantics.labelTruthTable = true;
      for (const [index, state] of labelCases.entries()) {
        card.hass = makeHass(Object.fromEntries(["pv", "inverter", "grid", "battery", "load"].map(id => [`sensor.${id}`, { state }])));
        await waitForUpdate();
        for (const [node, labels] of Object.entries(expectedLabels)) {
          semantics.labelTruthTable &&= root.querySelector(`.${node} .flow-state`).textContent === labels[index];
        }
      }
      card.hass = makeHass();
      await waitForUpdate();
      semantics.screenshotCase = root.querySelector(".pv strong").textContent === "0 W"
        && root.querySelector(".inverter strong").textContent === "176 W"
        && root.querySelector(".battery-power").textContent === "209 W"
        && root.querySelector(".battery-soc-value").textContent === "87%"
        && root.querySelector(".grid strong").textContent === "48 W"
        && root.querySelector(".load strong").textContent === "224 W"
        && root.querySelector(".inverter .flow-state").textContent === "Supplying"
        && root.querySelector(".battery .flow-state").textContent === "Discharging";
      const stableAnimations = pulses.map(pulse => pulse.getAnimations()[0]);
      card.hass = makeHass({ "sensor.inverter": { state: "unavailable" } });
      await waitForUpdate();
      semantics.configuredInverterUnavailable = root.querySelector(".inverter strong").textContent === "—"
        && root.querySelector(".inverter .flow-state").textContent === "Unavailable";
      const fallbackConfig = { ...config };
      delete fallbackConfig.inverter_power;
      card.setConfig(fallbackConfig);
      card.hass = makeHass({ "sensor.pv": { state: "345" } });
      await waitForUpdate();
      semantics.omittedInverterHidden = root.querySelector(".inverter").hidden
        && root.querySelector(".pv-line").hidden;
      semantics.semanticUpdatesPreserveIdentity = stableAnimations.every((animation, index) => pulses[index].getAnimations()[0] === animation);
      card.setConfig(config);
      card.hass = makeHass();
      await waitForUpdate();

      const openedEntities = [];
      card.addEventListener("hass-more-info", event => openedEntities.push(event.detail.entityId));
      root.querySelector('.summary [data-key="daily_solar"]').click();
      root.querySelector(".pv").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, composed: true }));
      semantics.detailsPopup = openedEntities.join(",") === "sensor.solar_day,sensor.pv";

      card.hass = makeHass({ "sensor.battery": { state: "-209" }, "sensor.grid": { state: "unavailable" } });
      await waitForUpdate();
      semantics.valueColors = root.querySelector(".inverter strong").dataset.valueTone === "positive"
        && root.querySelector(".battery-power").dataset.valueTone === "negative"
        && root.querySelector(".pv strong").dataset.valueTone === "idle"
        && root.querySelector(".grid strong").dataset.valueTone === "unavailable";

      card.setConfig({ pv_power: config.pv_power });
      card.hass = makeHass();
      await waitForUpdate();
      semantics.unassignedHidden = !root.querySelector(".pv").hidden
        && root.querySelector(".inverter").hidden
        && root.querySelector(".battery").hidden
        && root.querySelector(".grid").hidden
        && root.querySelector(".load").hidden
        && root.querySelector(".soc").hidden
        && root.querySelector(".summary").hidden
        && [...root.querySelectorAll(".line")].every(line => line.hidden);
      card.setConfig(config);
      card.hass = makeHass();
      await waitForUpdate();

      if (reducedMotion) {
        card.hass = makeHass({ "sensor.pv": { state: "0.5" } });
        await waitForUpdate();
        const inactive = getComputedStyle(pulses[0]).visibility === "hidden";
        card.hass = makeHass({ "sensor.pv": { state: "1200" } });
        await waitForUpdate();
        lifecycle.reducedMotion = animations.every(animation => animation == null)
          && inactive && getComputedStyle(pulses[0]).visibility === "visible";
      } else {
        let renderCalls = 0;
        const render = card.render.bind(card);
        card.render = () => { renderCalls += 1; return render(); };
        card.hass = makeHass({ "sensor.unrelated": { state: "changed" } });
        await waitForUpdate();
        lifecycle.unrelatedUpdateFiltered = renderCalls === 0;

        const beforeRefresh = animations.map(animation => animation.currentTime);
        card.hass = makeHass({ "sensor.load_day": { state: "2.4" } });
        card.hass = makeHass({ "sensor.load_day": { state: "2.5" } });
        await waitForUpdate();
        lifecycle.updatesCoalesced = renderCalls === 1;
        lifecycle.refreshIdentity = lines.every((line, index) => root.querySelectorAll(".line")[index] === line)
          && pulses.every((pulse, index) => root.querySelectorAll(".line i")[index] === pulse)
          && animations.every((animation, index) => pulses[index].getAnimations()[0] === animation);
        lifecycle.refreshContinuity = animations.every((animation, index) => Math.abs(animation.currentTime - beforeRefresh[index]) < 100);

        const pvAnimation = animations[0];
        const beforeSpeed = pvAnimation.currentTime;
        card.hass = makeHass({ "sensor.pv": { state: "1200" } });
        await waitForUpdate();
        lifecycle.speedPhaseContinuous = pvAnimation === pulses[0].getAnimations()[0]
          && Math.abs(pvAnimation.currentTime - beforeSpeed) < 100;
        lifecycle.speedChanged = Math.abs(playbackRateRequests.get(pvAnimation) - (1 / 1.5)) < .001;

        const beforeReverse = pvAnimation.currentTime;
        card.hass = makeHass({ "sensor.pv": { state: "-1200" } });
        await waitForUpdate();
        const reversePhaseDelta = Math.abs((pvAnimation.currentTime % 1000) - (beforeReverse % 1000));
        lifecycle.reversePhaseContinuous = pvAnimation === pulses[0].getAnimations()[0]
          && Math.min(reversePhaseDelta, 1000 - reversePhaseDelta) < 100;
        lifecycle.directionChanged = playbackRateRequests.get(pvAnimation) < 0;

        card.hass = makeHass({ "sensor.pv": { state: "0.5" } });
        await waitForUpdate();
        const inactive = getComputedStyle(pulses[0]).visibility === "hidden";
        card.hass = makeHass({ "sensor.pv": { state: "100" } });
        await waitForUpdate();
        lifecycle.activeThreshold = inactive && getComputedStyle(pulses[0]).visibility === "visible"
          && pulses[0].getAnimations()[0] === pvAnimation;

        const historyNow = Date.now();
        resolveHistory([[
          { state: "10", last_changed: new Date(historyNow - 20 * 60 * 60 * 1000).toISOString() },
          { state: "15", last_changed: new Date(historyNow - 8 * 60 * 60 * 1000).toISOString() },
        ]]);
        await new Promise(resolve => setTimeout(resolve, 100));
        const trendLine = root.querySelector(".trend-line").getAttribute("d");
        const trendArea = root.querySelector(".trend-area").getAttribute("d");
        lifecycle.historyIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && trendLine.startsWith("M ") && trendLine.includes(" C ")
          && trendArea.startsWith(trendLine) && trendArea.endsWith(" Z");

        card.setConfig({ ...config, title: "Updated solar power flow" });
        await waitForUpdate();
        lifecycle.configIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && root.querySelector("h2").textContent === "Updated solar power flow";

        card.setConfig({ ...config, view_mode: systemView ? "overview" : "system" });
        await waitForUpdate();
        lifecycle.modeSwitchIdentity = animations.every((animation, index) => pulses[index].getAnimations()[0] === animation)
          && details.hidden === systemView;

        card._intersecting = false;
        card.syncAnimationPlayback();
        const paused = animations.every(animation => animation.playState === "paused");
        card._intersecting = true;
        card.syncAnimationPlayback();
        lifecycle.offscreenPauseResume = paused && animations.every(animation => animation.playState === "running");
      }
      const tests = {
        labelContrast: labelContrast >= 4.5,
        valueContrast: valueContrast >= 4.5,
        expectedDirections: reducedMotion || animations.map(animation => Math.sign(playbackRateRequests.get(animation))).join(",") === "1,-1,1,1",
        seamlessLoopOffset: animationOffsets.join(",") === "68" && animationOffsets.every(offset => Math.abs(offset) % 34 === 0),
        seamlessPattern: pulseBackgrounds.every(value => value.includes("repeating-linear-gradient")),
        fullConnectorPulse: pulseWidths.every(([line, pulse]) => Math.abs(pulse - line - 68) <= 1),
        responsiveColumns: summaryColumns === (innerWidth <= 450 ? 2 : 4),
        noHorizontalOverflow: root.querySelector("ha-card").scrollWidth <= hostWidth,
        batteryValueContained: battery.scrollWidth <= battery.clientWidth,
        dailyValuesRaw: summaries.map(item => item.querySelector("b").textContent).join(",") === "0.9 kWh,2.3 kWh,2.6 kWh,0.0 kWh" && statisticsCalls === 0,
        editorDropdownPreserved: editor.querySelector("ha-entity-picker") === openPicker && openPicker.menuOpen && document.activeElement === openPicker,
        editorEntityInventory: editor.querySelectorAll("ha-entity-picker").length === 41 && editor.querySelector("select").value === (systemView ? "system" : "overview"),
        viewMode: viewModeCorrect,
        ...semantics,
        ...lifecycle,
      };
      document.querySelector("#result").textContent = JSON.stringify({
        theme: dark ? "dark" : "light", width: innerWidth, tests,
        contrast: { label: labelContrast.toFixed(2), value: valueContrast.toFixed(2) }, animationOffsets,
      });
    </script>
  </body>
</html>
